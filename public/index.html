<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Internet's Pet - Gerald</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      text-align: center; 
      background: #121218; 
      color: #fff; 
      padding: 20px; 
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .card {
      background: #1e1e28;
      border: 2px solid #2d2d3a;
      border-radius: 16px;
      padding: 24px;
      max-width: 380px;
      width: 100%;
      margin: 10px auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .pet-container {
      width: 160px;
      height: 160px;
      margin: 0 auto 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a2a38;
      border-radius: 50%;
      border: 4px solid #3b3b4f;
      transition: all 0.3s ease;
    }

    .pet-container.dead {
      background: #1a1a24;
      border-color: #444;
    }

    .pet-container svg {
      width: 120px;
      height: 120px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-alive { background: #2e7d32; color: #a5d6a7; }
    .status-dead { background: #c62828; color: #ffcdd2; }
    .status-connecting { background: #f9a825; color: #fffde7; }

    .conn-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      display: inline-block;
    }
    .conn-online { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
    .conn-offline { background: #f44336; box-shadow: 0 0 6px #f44336; }

    .bar-group {
      text-align: left;
      margin-bottom: 12px;
    }

    .bar-label {
      font-size: 12px;
      font-weight: bold;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .bar-container { 
      width: 100%; 
      height: 12px; 
      background: #111; 
      border-radius: 6px; 
      overflow: hidden; 
    }

    .fill { 
      height: 100%; 
      transition: width 0.4s ease; 
    }

    #health-bar { background: #ff5252; }
    #hunger-bar { background: #ffb74d; }
    #happiness-bar { background: #4fc3f7; }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button { 
      flex: 1;
      background: #ff70a6; 
      color: #fff;
      border: none; 
      padding: 14px; 
      font-size: 15px;
      font-weight: bold; 
      cursor: pointer; 
      border-radius: 10px; 
      box-shadow: 0 4px 0 #d44d7d;
      transition: all 0.1s;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d44d7d;
    }

    button:disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #ff5252;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #log { 
      font-size: 12px; 
      color: #777; 
      margin-top: 20px; 
      height: 80px; 
      overflow-y: auto; 
      text-align: left;
      padding: 8px;
      background: #16161f;
      border-radius: 8px;
    }
    
    #log p { margin: 4px 0; }

    .resurrection-timer {
      font-size: 14px;
      color: #ff8a80;
      margin-top: 10px;
      font-weight: bold;
    }

    .stats {
      font-size: 11px;
      color: #666;
      margin-top: 12px;
    }

    @media (max-width: 400px) {
      .card { padding: 16px; }
      .pet-container { width: 140px; height: 140px; }
      .pet-container svg { width: 100px; height: 100px; }
      button { font-size: 14px; padding: 12px; }
    }
  </style>
</head>
<body>

  <div id="toast"></div>

  <div class="card">
    <h2 style="margin-top:0">Gerald (Gen <span id="gen">1</span>)</h2>
    
    <div class="status-row">
      <span class="conn-status" id="conn-dot"></span>
      <div class="status-badge status-connecting" id="status">Connecting...</div>
    </div>

    <div class="pet-container" id="avatar-box">
      <svg viewBox="0 0 100 100">
        <path d="M 25,35 L 15,10 L 40,25 Z" fill="#ffb74d"/>
        <path d="M 75,35 L 85,10 L 60,25 Z" fill="#ffb74d"/>
        <circle cx="50" cy="50" r="30" fill="#ffb74d"/>
        <circle cx="40" cy="45" r="4" fill="#000"/>
        <circle cx="60" cy="45" r="4" fill="#000"/>
        <polygon points="50,52 46,57 54,57" fill="#ff8a80"/>
        <path d="M 44,60 Q 50,65 56,60" stroke="#000" stroke-width="2" fill="none"/>
      </svg>
    </div>

    <div class="bar-group">
      <div class="bar-label"><span>HEALTH</span><span id="health-val">100%</span></div>
      <div class="bar-container"><div id="health-bar" class="fill"></div></div>
    </div>

    <div class="bar-group">
      <div class="bar-label"><span>HUNGER</span><span id="hunger-val">0%</span></div>
      <div class="bar-container"><div id="hunger-bar" class="fill"></div></div>
    </div>

    <div class="bar-group">
      <div class="bar-label"><span>HAPPINESS</span><span id="hap-val">100%</span></div>
      <div class="bar-container"><div id="happiness-bar" class="fill"></div></div>
    </div>

    <div class="btn-group">
      <button onclick="doAction('feed')" id="btn-feed">🐟 Feed</button>
      <button onclick="doAction('play')" id="btn-play">🧶 Play</button>
    </div>

    <div class="resurrection-timer" id="res-timer" style="display:none"></div>

    <div id="log"><p style="margin:4px 0">--- Activity Log ---</p></div>
    
    <div class="stats" id="stats"></div>
  </div>

  <script>
    const socket = io({
      reconnection: true,
      reconnectionAttempts: 5,
      reconnectionDelay: 1000
    });

    const HAPPY_CAT = `
      <svg viewBox="0 0 100 100">
        <path d="M 25,35 L 15,10 L 40,25 Z" fill="#ffb74d"/>
        <path d="M 75,35 L 85,10 L 60,25 Z" fill="#ffb74d"/>
        <circle cx="50" cy="50" r="30" fill="#ffb74d"/>
        <circle cx="40" cy="45" r="4" fill="#000"/>
        <circle cx="60" cy="45" r="4" fill="#000"/>
        <polygon points="50,52 46,57 54,57" fill="#ff8a80"/>
        <path d="M 42,59 Q 50,66 58,59" stroke="#000" stroke-width="2" fill="none"/>
        <path d="M 20,50 L 5,48 M 20,53 L 5,55" stroke="#000" stroke-width="1.5"/>
        <path d="M 80,50 L 95,48 M 80,53 L 95,55" stroke="#000" stroke-width="1.5"/>
      </svg>`;

    const HUNGRY_CAT = `
      <svg viewBox="0 0 100 100">
        <path d="M 25,35 L 15,10 L 40,25 Z" fill="#ffb74d"/>
        <path d="M 75,35 L 85,10 L 60,25 Z" fill="#ffb74d"/>
        <circle cx="50" cy="50" r="30" fill="#ffb74d"/>
        <ellipse cx="40" cy="45" rx="5" ry="6" fill="#000"/>
        <ellipse cx="60" cy="45" rx="5" ry="6" fill="#000"/>
        <polygon points="50,52 46,57 54,57" fill="#ff8a80"/>
        <path d="M 44,64 Q 50,58 56,64" stroke="#000" stroke-width="2" fill="none"/>
      </svg>`;

    const DEAD_CAT = `
      <svg viewBox="0 0 100 100">
        <ellipse cx="50" cy="80" rx="35" ry="10" fill="#111"/>
        <path d="M 30,90 L 70,90 L 65,40 Q 50,30 35,40 Z" fill="#78909c"/>
        <text x="50" y="65" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">R.I.P.</text>
      </svg>`;

    let geraldState = {};
    let resurrectionTime = null;
    let timerInterval = null;

    function showToast(msg, type = 'error') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = type === 'error' ? '#ff5252' : '#4caf50';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function updateConnectionStatus(connected) {
      const dot = document.getElementById('conn-dot');
      dot.classList.toggle('conn-online', connected);
      dot.classList.toggle('conn-offline', !connected);
    }

    function updateResurrectionTimer() {
      const el = document.getElementById('res-timer');
      if (!resurrectionTime || geraldState.status !== 'DEAD') {
        el.style.display = 'none';
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        return;
      }
      
      const diff = resurrectionTime - Date.now();
      if (diff <= 0) {
        el.style.display = 'none';
        return;
      }
      
      const mins = Math.floor(diff / 60000);
      const secs = Math.floor((diff % 60000) / 1000);
      el.textContent = `New egg hatches in ${mins}m ${secs}s`;
      el.style.display = 'block';
    }

    socket.on('connect', () => {
      updateConnectionStatus(true);
    });

    socket.on('disconnect', () => {
      updateConnectionStatus(false);
      document.getElementById('status').textContent = 'Offline';
      document.getElementById('status').className = 'status-badge status-connecting';
    });

    socket.on('connect_error', () => updateConnectionStatus(false));

    socket.on('stateUpdate', (data) => {
      geraldState = data;
      document.getElementById('gen').innerText = data.generation;
      
      const statusEl = document.getElementById('status');
      const avatarBox = document.getElementById('avatar-box');
      
      if (data.status === 'DEAD') {
        statusEl.textContent = 'DEAD';
        statusEl.className = 'status-badge status-dead';
        avatarBox.classList.add('dead');
        avatarBox.innerHTML = DEAD_CAT;
      } else {
        statusEl.textContent = 'ALIVE';
        statusEl.className = 'status-badge status-alive';
        avatarBox.classList.remove('dead');
        avatarBox.innerHTML = data.hunger > 60 ? HUNGRY_CAT : HAPPY_CAT;
      }
      
      document.getElementById('health-bar').style.width = data.health + '%';
      document.getElementById('hunger-bar').style.width = data.hunger + '%';
      document.getElementById('happiness-bar').style.width = data.happiness + '%';

      document.getElementById('health-val').innerText = data.health + '%';
      document.getElementById('hunger-val').innerText = data.hunger + '%';
      document.getElementById('hap-val').innerText = data.happiness + '%';

      // Handle resurrection timer
      if (data.resurrectsAt && data.status === 'DEAD') {
        resurrectionTime = data.resurrectsAt;
        if (!timerInterval) timerInterval = setInterval(updateResurrectionTimer, 1000);
        updateResurrectionTimer();
      } else {
        resurrectionTime = null;
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        document.getElementById('res-timer').style.display = 'none';
      }

      // Disable buttons if dead
      document.getElementById('btn-feed').disabled = data.status === 'DEAD';
      document.getElementById('btn-play').disabled = data.status === 'DEAD';
      
      // Stats
      if (data.stats) {
        document.getElementById('stats').textContent = 
          `${data.stats.feeds || 0} feeds · ${data.stats.plays || 0} plays · ${data.stats.deaths || 0} deaths`;
      }
    });

    socket.on('log', (msg) => {
      const logDiv = document.getElementById('log');
      const p = document.createElement('p');
      p.style.margin = '4px 0';
      p.textContent = msg;
      logDiv.insertBefore(p, logDiv.firstChild);
      while (logDiv.children.length > 20) {
        logDiv.removeChild(logDiv.lastChild);
      }
    });

    socket.on('errorMsg', (msg) => showToast(msg, 'error'));

    function doAction(type) {
      socket.emit('action', { type });
    }
  </script>
</body>
</html>
