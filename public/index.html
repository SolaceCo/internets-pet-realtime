<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Internet's Pet - Gerald</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      text-align: center; 
      background: #121218; 
      color: #fff; 
      padding: 20px; 
      margin: 0;
    }
    
    .card {
      background: #1e1e28;
      border: 2px solid #2d2d3a;
      border-radius: 16px;
      padding: 20px;
      max-width: 340px;
      margin: 10px auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .pet-container {
      width: 160px;
      height: 160px;
      margin: 0 auto 15px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2a2a38;
      border-radius: 50%;
      border: 4px solid #3b3b4f;
    }

    .pet-container svg {
      width: 120px;
      height: 120px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      background: #2e7d32;
      color: #a5d6a7;
      margin-bottom: 15px;
    }

    .bar-group {
      text-align: left;
      margin-bottom: 10px;
    }

    .bar-label {
      font-size: 12px;
      font-weight: bold;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .bar-container { 
      width: 100%; 
      height: 12px; 
      background: #111; 
      border-radius: 6px; 
      overflow: hidden; 
    }

    .fill { 
      height: 100%; 
      transition: width 0.4s ease; 
    }

    #health-bar { background: #ff5252; }
    #hunger-bar { background: #ffb74d; }
    #happiness-bar { background: #4fc3f7; }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button { 
      flex: 1;
      background: #ff70a6; 
      color: #fff;
      border: none; 
      padding: 12px; 
      font-size: 14px;
      font-weight: bold; 
      cursor: pointer; 
      border-radius: 10px; 
      box-shadow: 0 4px 0 #d44d7d;
      transition: all 0.1s;
    }

    button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #d44d7d;
    }

    #log { 
      font-size: 12px; 
      color: #777; 
      margin-top: 20px; 
      height: 60px; 
      overflow-y: auto; 
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Gerald (Gen <span id="gen">1</span>)</h2>
    <div class="status-badge" id="status">Connecting...</div>

    <div class="pet-container" id="avatar-box">
      <!-- Default SVG Cat -->
      <svg viewBox="0 0 100 100" id="cat-svg">
        <path d="M 25,35 L 15,10 L 40,25 Z" fill="#ffb74d"/>
        <path d="M 75,35 L 85,10 L 60,25 Z" fill="#ffb74d"/>
        <circle cx="50" cy="50" r="30" fill="#ffb74d"/>
        <circle cx="40" cy="45" r="4" fill="#000"/>
        <circle cx="60" cy="45" r="4" fill="#000"/>
        <polygon points="50,52 46,57 54,57" fill="#ff8a80"/>
        <path d="M 44,60 Q 50,65 56,60" stroke="#000" stroke-width="2" fill="none"/>
      </svg>
    </div>

    <div class="bar-group">
      <div class="bar-label"><span>HEALTH</span><span id="health-val">100%</span></div>
      <div class="bar-container"><div id="health-bar" class="fill"></div></div>
    </div>

    <div class="bar-group">
      <div class="bar-label"><span>HUNGER</span><span id="hunger-val">0%</span></div>
      <div class="bar-container"><div id="hunger-bar" class="fill"></div></div>
    </div>

    <div class="bar-group">
      <div class="bar-label"><span>HAPPINESS</span><span id="hap-val">100%</span></div>
      <div class="bar-container"><div id="happiness-bar" class="fill"></div></div>
    </div>

    <div class="btn-group">
      <button onclick="doAction('feed')">🐟 Feed</button>
      <button onclick="doAction('play')">🧶 Play</button>
    </div>

    <div id="log">--- Activity Log ---</div>
  </div>

  <script>
    const socket = io();

    // SVG Cat Variants
    const HAPPY_CAT = `
      <svg viewBox="0 0 100 100">
        <path d="M 25,35 L 15,10 L 40,25 Z" fill="#ffb74d"/>
        <path d="M 75,35 L 85,10 L 60,25 Z" fill="#ffb74d"/>
        <circle cx="50" cy="50" r="30" fill="#ffb74d"/>
        <circle cx="40" cy="45" r="4" fill="#000"/>
        <circle cx="60" cy="45" r="4" fill="#000"/>
        <polygon points="50,52 46,57 54,57" fill="#ff8a80"/>
        <path d="M 42,59 Q 50,66 58,59" stroke="#000" stroke-width="2" fill="none"/>
        <path d="M 20,50 L 5,48 M 20,53 L 5,55" stroke="#000" stroke-width="1.5"/>
        <path d="M 80,50 L 95,48 M 80,53 L 95,55" stroke="#000" stroke-width="1.5"/>
      </svg>`;

    const HUNGRY_CAT = `
      <svg viewBox="0 0 100 100">
        <path d="M 25,35 L 15,10 L 40,25 Z" fill="#ffb74d"/>
        <path d="M 75,35 L 85,10 L 60,25 Z" fill="#ffb74d"/>
        <circle cx="50" cy="50" r="30" fill="#ffb74d"/>
        <ellipse cx="40" cy="45" rx="5" ry="6" fill="#000"/>
        <ellipse cx="60" cy="45" rx="5" ry="6" fill="#000"/>
        <polygon points="50,52 46,57 54,57" fill="#ff8a80"/>
        <path d="M 44,64 Q 50,58 56,64" stroke="#000" stroke-width="2" fill="none"/>
      </svg>`;

    const DEAD_CAT = `
      <svg viewBox="0 0 100 100">
        <ellipse cx="50" cy="80" rx="35" ry="10" fill="#111"/>
        <path d="M 30,90 L 70,90 L 65,40 Q 50,30 35,40 Z" fill="#78909c"/>
        <text x="50" y="65" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">R.I.P.</text>
      </svg>`;

    socket.on('stateUpdate', (data) => {
      document.getElementById('gen').innerText = data.generation;
      document.getElementById('status').innerText = data.status;
      
      document.getElementById('health-bar').style.width = data.health + '%';
      document.getElementById('hunger-bar').style.width = data.hunger + '%';
      document.getElementById('happiness-bar').style.width = data.happiness + '%';

      document.getElementById('health-val').innerText = data.health + '%';
      document.getElementById('hunger-val').innerText = data.hunger + '%';
      document.getElementById('hap-val').innerText = data.happiness + '%';

      const avatarBox = document.getElementById('avatar-box');

      if (data.status === 'DEAD') {
        avatarBox.innerHTML = DEAD_CAT;
      } else if (data.hunger > 60) {
        avatarBox.innerHTML = HUNGRY_CAT;
      } else {
        avatarBox.innerHTML = HAPPY_CAT;
      }
    });

    socket.on('log', (msg) => {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML = `<p style="margin:4px 0">${msg}</p>` + logDiv.innerHTML;
    });

    socket.on('errorMsg', (msg) => {
      alert(msg);
    });

    function doAction(type) {
      socket.emit('action', { type });
    }
  </script>
</body>
</html>
